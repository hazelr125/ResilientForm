<!doctype html><html><head><title>No ids/names, labels wrap inputs, table layout</title></head><body><form><table>
<tr><td><label>Full Name <input type="text"></label></td></tr>
<tr><td><label>Last Name <input type="text"></label></td></tr>
<tr><td><label>First Name <input type="text"></label></td></tr>
<tr><td><fieldset><legend>Gender</legend>
  <label><input type="radio" name="x"> Male</label>
  <label><input type="radio" name="x"> Female</label></fieldset></td></tr>
<tr><td><label>Country <select><option value="">Select Country</option><option>India</option><option>United States</option></select></label></td></tr>
<tr><td><label>State <select><option value="">Select State</option><option>Maharashtra</option><option>Karnataka</option><option>Goa</option></select></label></td></tr>
</table></form></body></html>
